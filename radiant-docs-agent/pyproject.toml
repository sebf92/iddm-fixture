[project]
name = "radiant-docs-agent"
version = "0.0.0"
description = "A Managed Deep Agent project."
requires-python = ">=3.11"
dependencies = [
    "managed-deepagents==0.8.4.dev2",
    "langchain-core",
    "ddgs",
    "httpx",
    "beautifulsoup4",
    # Windows-only: langgraph dev console logging needs it.
    "colorama; sys_platform == 'win32'",
    # Runtime deps a direct LangGraph deployment needs (mda adds them itself).
    "deepagents>=0.7.5",
    "langchain>=1.3.15",
    "langchain-openai>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-sdk>=0.4.2",
    "langsmith>=0.10.17",
    "mcp>=1.24.0,<2.0.0",
    "pyjwt[crypto]>=2.8.0",
]

[tool.mda]
python-version = "3.14"

# Let `pip install .` succeed on a direct LangGraph deployment: the modules are
# loaded by path from langgraph.json, so the wheel itself ships nothing.
[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
